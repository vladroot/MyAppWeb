# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  app:
    build: .
    environment:
      PostgresConnection: ${POSTGRES_CONNECTION}
      SqliteConnnection: ${SQLITE_CONNECTION}
      MongoConnection: ${MONGO_CONNECTION}
      MongoDb: ${MONGO_DB}
      RedisConnection: ${REDIS_CONNECTION}
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgresql:
    image: postgres:bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - ./check-mongo.sh:/usr/local/bin/check-mongo.sh:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "/usr/local/bin/check-mongo.sh" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  # Cache behind IDistributedCache (used by GET /getproducts). The password lives in .env
  # and is passed to the container as an environment variable, never as a command-line flag
  # on the compose level, so `docker inspect` shows no interpolated secret in the command.
  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # sh -c is required: the exec form would pass the literal "$REDIS_PASSWORD" to
    # redis-server instead of expanding it, while the healthcheck (a shell) would expand it.
    command: [ "sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes" ]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  mongoconfig:
  redisdata:
